<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="posBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="laptopBodyPos" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="screenGradPos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="luminaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="600" height="450" fill="url(#posBg)"/>
  <rect x="2" y="2" width="596" height="446" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Brand Badge Top Left -->
  <rect x="36" y="32" width="90" height="26" rx="6" fill="#EA580C"/>
  <text x="81" y="49" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">POSITIVO</text>
  
  <!-- Status Badge Top Right -->
  <rect x="345" y="32" width="219" height="26" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="454" y="49" fill="#92400E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">MODELOS DISTINTOS POR LOJA</text>

  <!-- Laptop Silhouette Illustration with Lumina Bar -->
  <g transform="translate(140, 95)">
    <!-- Screen Bezel -->
    <rect x="20" y="20" width="280" height="175" rx="10" fill="url(#laptopBodyPos)"/>
    <!-- Inner Screen -->
    <rect x="30" y="30" width="260" height="155" rx="4" fill="url(#screenGradPos)"/>
    
    <!-- Lumina Bar LED strip at webcam -->
    <g filter="url(#luminaGlow)">
      <rect x="110" y="23" width="36" height="3" rx="1.5" fill="#FFFFFF"/>
      <circle cx="160" cy="24.5" r="2.5" fill="#000000" stroke="#4B5563" stroke-width="0.8"/>
      <rect x="174" y="23" width="36" height="3" rx="1.5" fill="#FFFFFF"/>
    </g>
    
    <!-- Screen Display Elements -->
    <rect x="44" y="44" width="70" height="14" rx="3" fill="#EA580C" opacity="0.9"/>
    <text x="48" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold">VISION C SERIES</text>
    <rect x="44" y="66" width="130" height="7" rx="2" fill="#94A3B8" opacity="0.5"/>
    <rect x="44" y="78" width="90" height="7" rx="2" fill="#64748B" opacity="0.4"/>
    
    <!-- Smart Touch / Minitela Indicator on right of chassis -->
    <rect x="282" y="80" width="6" height="22" rx="2" fill="#38BDF8" opacity="0.85"/>
    
    <!-- Positivo Logo in Screen Center -->
    <text x="160" y="115" fill="#EA580C" opacity="0.9" font-family="sans-serif" font-weight="900" font-size="13" text-anchor="middle">POSITIVO</text>
    <text x="160" y="130" fill="#94A3B8" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">Lumina Bar • C15M / C14</text>
    
    <!-- Laptop Base / Hinge -->
    <polygon points="0,205 320,205 300,195 20,195" fill="#4B5563"/>
    <rect x="0" y="205" width="320" height="12" rx="4" fill="#1F2937"/>
    <!-- Trackpad cutout -->
    <rect x="125" y="206" width="70" height="3" rx="1.5" fill="#64748B"/>
  </g>
  
  <!-- Specs Summary at Bottom -->
  <text x="300" y="375" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Notebook Positivo Vision C Series (C15M / C14 Lumina)</text>
  <text x="300" y="398" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Amazon: C15M 15.6" FHD IPS N4500 | ML: C14 Lumina BAR N4020 | Shopee: C14 Linux</text>
</svg>
