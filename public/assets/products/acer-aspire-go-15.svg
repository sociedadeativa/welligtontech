  <text x="300" y="365" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Acer Aspire Go 15</text>
  <text x="300" y="390" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Intel Core i5-1334U • 8GB LPDDR5 • 15.3" WUXGA IPS 16:10</text>
