<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="acerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="acerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenAcer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#acerBg)"/>
  <rect x="2" y="2" width="596" height="446" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Brand Badge Top Left -->
  <rect x="36" y="32" width="70" height="26" rx="6" fill="#16A34A"/>
  <text x="71" y="49" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle">ACER</text>
  
  <!-- Status Badge Top Right -->
  <rect x="424" y="32" width="140" height="26" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="494" y="49" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FOTO NÃO FORNECIDA</text>

  <!-- Laptop Silhouette -->
  <g transform="translate(140, 100)">
    <rect x="20" y="20" width="280" height="175" rx="8" fill="url(#acerBody)"/>
    <rect x="28" y="28" width="264" height="159" rx="3" fill="url(#screenAcer)"/>
    
    <text x="160" y="105" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="16" text-anchor="middle">Aspire Go 15</text>
    <text x="160" y="125" fill="#BBF7D0" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">15.3" WUXGA 16:10 Antirreflexo</text>
    
    <polygon points="0,205 320,205 298,195 22,195" fill="#475569"/>
    <rect x="0" y="205" width="320" height="12" rx="4" fill="#0F172A"/>
    <rect x="130" y="206" width="60" height="3" rx="1.5" fill="#4ADE80"/>
