  <text x="300" y="390" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Intel Core 5 1335U • 8GB RAM • 512GB SSD • 15.6" Full HD</text>
