<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="lenovoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="lenovoBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="screenGradLenovo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#lenovoBg)"/>
  <rect x="2" y="2" width="596" height="446" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Brand Badge Top Left -->
  <rect x="36" y="32" width="86" height="26" rx="6" fill="#E11D48"/>
  <text x="79" y="49" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle">LENOVO</text>
  
  <!-- Status Badge Top Right -->
  <rect x="424" y="32" width="140" height="26" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="494" y="49" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FOTO NÃO FORNECIDA</text>

  <!-- Laptop Silhouette -->
  <g transform="translate(140, 100)">
    <rect x="20" y="20" width="280" height="175" rx="8" fill="url(#lenovoBody)"/>
    <rect x="28" y="28" width="264" height="159" rx="3" fill="url(#screenGradLenovo)"/>
    
    <!-- Display Graphics -->
    <rect x="42" y="42" width="50" height="14" rx="3" fill="#E11D48" opacity="0.8"/>
    <rect x="42" y="64" width="130" height="8" rx="2" fill="#94A3B8" opacity="0.6"/>
    <rect x="42" y="78" width="90" height="8" rx="2" fill="#64748B" opacity="0.4"/>
    
    <text x="160" y="115" fill="#E2E8F0" opacity="0.7" font-family="sans-serif" font-weight="800" font-size="13" text-anchor="middle">15.3" WUXGA 16:10</text>
    
    <polygon points="0,205 320,205 298,195 22,195" fill="#64748B"/>
    <rect x="0" y="205" width="320" height="12" rx="4" fill="#334155"/>
    <rect x="130" y="206" width="60" height="3" rx="1.5" fill="#94A3B8"/>
  </g>
  
  <text x="300" y="365" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Lenovo IdeaPad Slim 3 15IRU10</text>
  <text x="300" y="390" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Intel Core 3 100U • 8GB LPDDR5 • 256GB SSD • 15.3" WUXGA</text>
</svg>
