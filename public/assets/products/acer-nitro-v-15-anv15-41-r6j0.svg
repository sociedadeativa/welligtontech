<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="nitroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="nitroBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screenNitro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#nitroBg)"/>
  <rect x="2" y="2" width="596" height="446" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Brand Badge Top Left -->
  <rect x="36" y="32" width="70" height="26" rx="6" fill="#DC2626"/>
  <text x="71" y="49" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle">NITRO</text>
  
  <!-- Status Badge Top Right -->
  <rect x="424" y="32" width="140" height="26" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="494" y="49" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FOTO NÃO FORNECIDA</text>

  <!-- Gaming Laptop Silhouette with Angular Aesthetics -->
  <g transform="translate(140, 100)">
    <rect x="20" y="20" width="280" height="175" rx="8" fill="url(#nitroBody)"/>
    <rect x="28" y="28" width="264" height="159" rx="3" fill="url(#screenNitro)"/>
    
    <text x="160" y="100" fill="#EF4444" font-family="sans-serif" font-weight="900" font-size="20" letter-spacing="2" text-anchor="middle">NITRO V 15</text>
    <text x="160" y="125" fill="#FCA5A5" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">RTX 4050 • 165Hz IPS</text>
    
    <!-- Red glowing hinge/accents -->
    <polygon points="0,205 320,205 296,193 24,193" fill="#991B1B"/>
    <rect x="0" y="205" width="320" height="14" rx="4" fill="#0F172A"/>
    <rect x="120" y="206" width="80" height="3" rx="1.5" fill="#EF4444"/>
  </g>
  
  <text x="300" y="365" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Acer Nitro V 15 ANV15-41-R6J0</text>
  <text x="300" y="390" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AMD Ryzen 7 7735HS • RTX 4050 6GB • 8GB DDR5 • 512GB SSD • 165Hz</text>
</svg>
