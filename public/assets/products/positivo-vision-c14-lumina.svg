    </linearGradient>
    <filter id="luminaGlowML" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#posBg14)"/>
  <rect x="2" y="2" width="596" height="446" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="36" y="32" width="90" height="26" rx="6" fill="#EA580C"/>
  <text x="81" y="49" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">POSITIVO</text>
  <rect x="330" y="32" width="234" height="26" rx="6" fill="#FEF08A" stroke="#CA8A04" stroke-width="1"/>
  <text x="447" y="49" fill="#713F12" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">MERCADO LIVRE • C14 LUMINA BAR</text>

