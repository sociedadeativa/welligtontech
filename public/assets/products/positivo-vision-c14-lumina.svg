    <rect x="42" y="64" width="120" height="7" rx="2" fill="#94A3B8" opacity="0.5"/>
    <rect x="42" y="76" width="90" height="7" rx="2" fill="#64748B" opacity="0.4"/>
    
    <text x="155" y="115" fill="#EA580C" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">POSITIVO</text>
    <text x="155" y="132" fill="#94A3B8" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Vision C14 Lumina BAR • Celeron N4020</text>
    
