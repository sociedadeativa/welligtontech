  <text x="300" y="398" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">Intel Celeron N4020 | 4GB RAM | 128GB eMMC | Tela 14" HD | Lumina BAR | Windows 11</text>
