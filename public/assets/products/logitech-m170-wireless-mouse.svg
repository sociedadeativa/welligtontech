<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="logiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="usbNano" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#logiBg)"/>
  <rect x="2" y="2" width="596" height="446" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Brand Badge Top Left -->
  <rect x="36" y="32" width="96" height="26" rx="6" fill="#0D9488"/>
  <text x="84" y="49" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle">LOGITECH</text>
  
  <!-- Status Badge Top Right -->
  <rect x="424" y="32" width="140" height="26" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="494" y="49" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FOTO NÃO FORNECIDA</text>

  <!-- Mouse Silhouette Illustration -->
  <g transform="translate(230, 95)">
    <!-- Wireless Waves -->
    <path d="M-20,40 A 60 60 0 0 1 -20,120" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M-35,25 A 80 80 0 0 1 -35,135" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Mouse Oval Ergonomic Body -->
    <path d="M70,10 C115,10 135,45 135,110 C135,175 115,210 70,210 C25,210 5,175 5,110 C5,45 25,10 70,10 Z" fill="url(#mouseBody)"/>
    
    <!-- Central Divider -->
    <line x1="70" y1="12" x2="70" y2="85" stroke="#0F172A" stroke-width="2.5"/>
    
    <!-- Scroll Wheel -->
    <rect x="63" y="28" width="14" height="34" rx="7" fill="#0F172A" stroke="#0D9488" stroke-width="1.5"/>
    <line x1="65" y1="40" x2="75" y2="40" stroke="#0D9488" stroke-width="1.5"/>
    <line x1="65" y1="46" x2="75" y2="46" stroke="#0D9488" stroke-width="1.5"/>
    <line x1="65" y1="52" x2="75" y2="52" stroke="#0D9488" stroke-width="1.5"/>
    
    <!-- Optical Light Accent / Logo -->
    <text x="70" y="165" fill="#94A3B8" opacity="0.7" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">logi</text>
    
    <!-- USB Nano Receiver Illustration next to mouse -->
    <g transform="translate(160, 110)">
      <rect x="0" y="0" width="30" height="40" rx="4" fill="url(#usbNano)"/>
      <rect x="5" y="22" width="20" height="15" fill="#0F172A"/>
      <rect x="9" y="3" width="12" height="15" fill="#E2E8F0"/>
      <text x="15" y="55" fill="#64748B" font-family="sans-serif" font-weight="600" font-size="9" text-anchor="middle">USB Nano</text>
    </g>
  </g>
  
  <text x="300" y="365" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Logitech M170 Wireless Mouse</text>
  <text x="300" y="390" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sem Fio 2.4 GHz • Receptor Nano USB • 1000 DPI • Ambidestro</text>
</svg>
