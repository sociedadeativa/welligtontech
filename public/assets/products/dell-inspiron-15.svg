<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="dellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="600" height="450" fill="url(#dellBg)"/>
  <rect x="2" y="2" width="596" height="446" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Brand Badge Top Left -->
  <rect x="36" y="32" width="70" height="26" rx="6" fill="#0284C7"/>
  <text x="71" y="49" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle">DELL</text>
  
  <!-- Status Badge Top Right -->
  <rect x="424" y="32" width="140" height="26" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="494" y="49" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FOTO NÃO FORNECIDA</text>

  <!-- Laptop Silhouette Illustration -->
  <g transform="translate(140, 100)">
    <!-- Screen Bezel -->
    <rect x="20" y="20" width="280" height="175" rx="10" fill="url(#laptopBody)"/>
    <!-- Inner Screen -->
    <rect x="30" y="30" width="260" height="155" rx="4" fill="url(#screenGrad)"/>
    
    <!-- Screen Display Elements -->
    <rect x="42" y="42" width="60" height="14" rx="3" fill="#38BDF8" opacity="0.8"/>
    <rect x="42" y="64" width="140" height="8" rx="2" fill="#94A3B8" opacity="0.6"/>
    <rect x="42" y="78" width="100" height="8" rx="2" fill="#64748B" opacity="0.4"/>
    
    <!-- Dell Logo in Screen Center -->
    <circle cx="160" cy="107" r="18" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>
    <text x="160" y="112" fill="#38BDF8" opacity="0.5" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">DELL</text>
    
    <!-- Laptop Base / Hinge -->
    <polygon points="0,205 320,205 300,195 20,195" fill="#475569"/>
    <rect x="0" y="205" width="320" height="12" rx="4" fill="#1E293B"/>
    <!-- Trackpad cutout -->
    <rect x="130" y="206" width="60" height="3" rx="1.5" fill="#64748B"/>
  </g>
  
  <!-- Product Label Bottom -->
  <text x="300" y="365" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Dell Inspiron 15</text>
  <text x="300" y="390" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Intel Core i5-1334U • 8GB RAM • 512GB SSD • 120Hz FHD</text>
</svg>
